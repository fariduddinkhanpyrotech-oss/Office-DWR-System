<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Central Office DWR System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#eef3f8;color:#1f2937}
header{background:#1f4e79;color:white;text-align:center;padding:16px}
.container{max-width:1200px;margin:20px auto;padding:0 12px}
.card{background:white;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
input,select,textarea,button{padding:9px;margin:5px;border:1px solid #cbd5e1;border-radius:6px}
textarea{width:98%;min-height:70px}
button{background:#1f4e79;color:white;border:none;font-weight:bold;cursor:pointer}
button:hover{background:#163b5c}
.red{background:#b91c1c}.green{background:#15803d}.orange{background:#b45309}.gray{background:#6b7280}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:10px;background:white}
th,td{border:1px solid #d9e2ec;padding:8px;text-align:left;vertical-align:top;font-size:13px}
th{background:#e7eef7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#f8fafc;border:1px solid #d9e2ec;border-radius:8px;text-align:center;padding:10px}
.stat b{font-size:22px;display:block}
.report{white-space:pre-wrap;background:#f8fafc;border:1px dashed #94a3b8;border-radius:8px;padding:12px;min-height:190px}
.high{background:#fee2e2}.medium{background:#fef3c7}.low{background:#dcfce7}
@media(max-width:850px){.grid,.stats{grid-template-columns:1fr}}
@media print{.no-print{display:none}.card{box-shadow:none}}
</style>
</head>
<body>
<header>
<h2>Central Office DWR System</h2>
<div>Daily Work Report | Leave Marking | Team & Password Management</div>
</header>

<div class="container">
<div id="loginBox" class="card">
<h3>Login</h3>
<p><b>Admin ID:</b> admin &nbsp; | &nbsp; <b>Password:</b> admin123</p>
<input id="loginId" placeholder="Login ID">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="loginNow()">Login</button>
</div>

<div id="appBox" class="hidden">
<div class="card no-print">
<b>Welcome:</b> <span id="welcomeName"></span> | <b>Role:</b> <span id="welcomeRole"></span>
<button class="red" style="float:right" onclick="logoutNow()">Logout</button>
</div>

<div class="card no-print">
<button onclick="showTab('dwrTab')">Daily Work Report</button>
<button onclick="showTab('teamTab')">Team / Password</button>
<button class="green" onclick="downloadBackup()">Download Backup</button>
<input type="file" id="backupFile" class="hidden" accept=".json" onchange="uploadBackup(event)">
<button class="gray" onclick="document.getElementById('backupFile').click()">Upload Backup</button>
</div>

<div id="dwrTab">
<div class="grid">
<div class="card">
<h3>Add DWR / Mark Leave</h3>
<input type="date" id="workDate">
<select id="dayStatus" onchange="toggleLeaveMode()">
<option value="Working">Working Day - Submit DWR</option>
<option value="Leave">On Leave - DWR Not Submitted</option>
</select>
<input id="project" placeholder="Project / Site / Department">
<select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select>
<textarea id="description" placeholder="Work description"></textarea>
<select id="status"><option>Pending</option><option>In Progress</option><option>On Hold</option><option>Completed</option></select>
<input type="number" id="planned" min="0" max="100" value="100" placeholder="Planned %">
<input type="number" id="actual" min="0" max="100" value="0" placeholder="Actual %">
<textarea id="remarks" placeholder="Remarks / Dependency / Leave Reason"></textarea>
<button onclick="addDWR()">Submit</button>
<button class="gray" onclick="clearForm()">Clear</button>
</div>

<div class="card">
<h3>Summary</h3>
<div class="stats">
<div class="stat">Total<b id="totalCount">0</b></div>
<div class="stat">High<b id="highCount">0</b></div>
<div class="stat">Completed<b id="completedCount">0</b></div>
<div class="stat">Leave<b id="leaveCount">0</b></div>
</div>
<button onclick="generateReport()">Generate Report</button>
<button class="gray" onclick="copyReport()">Copy Report</button>
<button class="green" onclick="exportCSV()">Export CSV</button>
<button class="orange" onclick="window.print()">Print / Save PDF</button>
<div id="reportOutput" class="report">Click Generate Report.</div>
</div>
</div>

<div class="card">
<h3>DWR Register</h3>
<input type="date" id="filterDate" onchange="renderDWR()">
<select id="filterType" onchange="renderDWR()"><option value="">All Type</option><option>Working</option><option>Leave</option></select>
<select id="filterStatus" onchange="renderDWR()"><option value="">All Status</option><option>Pending</option><option>In Progress</option><option>On Hold</option><option>Completed</option><option>Leave</option></select>
<input id="searchText" placeholder="Search" oninput="renderDWR()">
<table id="dwrTable"></table>
</div>
</div>

<div id="teamTab" class="card hidden">
<h3>Team Member & Password Management</h3>
<input id="empName" placeholder="Name">
<input id="empLogin" placeholder="Login ID">
<input id="empPass" placeholder="Password">
<select id="empRole"><option>User</option><option>Admin</option></select>
<button onclick="addMember()">Add / Update Member</button>
<table id="memberTable"></table>
</div>
</div>
</div>

<script>
var db = JSON.parse(localStorage.getItem("centralDWRDB") || '{"users":[{"name":"Administrator","login":"admin","password":"admin123","role":"Admin","active":true}],"dwr":[]}');
var currentUser = null;
var editIndex = -1;

function saveDB(){ localStorage.setItem("centralDWRDB", JSON.stringify(db)); }
function today(){ return new Date().toISOString().slice(0,10); }
function now(){ return new Date().toLocaleString(); }
document.getElementById("workDate").value = today();

function loginNow(){
  var id = document.getElementById("loginId").value.trim();
  var pass = document.getElementById("loginPass").value.trim();
  var u = db.users.find(function(x){ return x.login===id && x.password===pass && x.active; });
  if(!u){ alert("Invalid Login ID or Password"); return; }
  currentUser = u;
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("appBox").classList.remove("hidden");
  document.getElementById("welcomeName").innerText = u.name;
  document.getElementById("welcomeRole").innerText = u.role;
  renderAll();
}
function logoutNow(){ location.reload(); }
function isAdmin(){ return currentUser && currentUser.role==="Admin"; }
function showTab(id){
  document.getElementById("dwrTab").classList.add("hidden");
  document.getElementById("teamTab").classList.add("hidden");
  document.getElementById(id).classList.remove("hidden");
  renderAll();
}
function toggleLeaveMode(){
  var leave = document.getElementById("dayStatus").value === "Leave";
  document.getElementById("project").value = leave ? "LEAVE" : "";
  document.getElementById("description").value = leave ? "DWR not submitted due to leave" : "";
  document.getElementById("status").value = leave ? "Completed" : "Pending";
  document.getElementById("planned").value = leave ? 0 : 100;
  document.getElementById("actual").value = leave ? 0 : 0;
}

function clearForm(){
  document.getElementById("workDate").value = today();
  document.getElementById("dayStatus").value = "Working";
  document.getElementById("project").value = "";
  document.getElementById("priority").value = "Medium";
  document.getElementById("description").value = "";
  document.getElementById("status").value = "Pending";
  document.getElementById("planned").value = 100;
  document.getElementById("actual").value = 0;
  document.getElementById("remarks").value = "";
  editIndex = -1;
}

function addDWR(){
  var type = document.getElementById("dayStatus").value;
  var date = document.getElementById("workDate").value;
  var project = document.getElementById("project").value.trim();
  var desc = document.getElementById("description").value.trim();
  var rem = document.getElementById("remarks").value.trim();

  if(type==="Leave"){
    project = "LEAVE";
    desc = "DWR not submitted due to leave";
    if(!rem){ rem = "On Leave"; }
  } else {
    if(!date || !project || !desc){ alert("Please fill Date, Project/Site and Work Description"); return; }
  }

  var item = {
    date: date, type: type, project: project,
    priority: document.getElementById("priority").value,
    description: desc,
    status: type==="Leave" ? "Leave" : document.getElementById("status").value,
    planned: document.getElementById("planned").value,
    actual: document.getElementById("actual").value,
    remarks: rem,
    name: currentUser.name,
    login: currentUser.login,
    review: ""
  };
  if(editIndex > -1){ db.dwr[editIndex] = item; } else { db.dwr.push(item); }
  saveDB(); clearForm(); renderDWR(); generateReport();
}

function getFiltered(){
  return db.dwr.filter(function(e){
    if(!isAdmin() && e.login !== currentUser.login) return false;
    if(document.getElementById("filterDate").value && e.date !== document.getElementById("filterDate").value) return false;
    if(document.getElementById("filterType").value && e.type !== document.getElementById("filterType").value) return false;
    if(document.getElementById("filterStatus").value && e.status !== document.getElementById("filterStatus").value) return false;
    var search = document.getElementById("searchText").value.toLowerCase();
    var text = (e.name+" "+e.project+" "+e.description+" "+e.remarks).toLowerCase();
    if(search && text.indexOf(search) < 0) return false;
    return true;
  });
}

function renderDWR(){
  var rows = getFiltered();
  document.getElementById("totalCount").innerText = rows.length;
  document.getElementById("highCount").innerText = rows.filter(function(e){return e.priority==="High";}).length;
  document.getElementById("completedCount").innerText = rows.filter(function(e){return e.status==="Completed";}).length;
  document.getElementById("leaveCount").innerText = rows.filter(function(e){return e.type==="Leave";}).length;

  var html = "<tr><th>S.No.</th><th>Date</th><th>Name</th><th>Type</th><th>Project/Site</th><th>Priority</th><th>Description</th><th>Status</th><th>Plan%</th><th>Actual%</th><th>Remarks</th><th>Review</th><th>Action</th></tr>";
  rows.forEach(function(e,i){
    var idx = db.dwr.indexOf(e);
    var action = "<button class='gray' onclick='editDWR("+idx+")'>Edit</button><button class='red' onclick='deleteDWR("+idx+")'>Delete</button>";
    if(isAdmin()){ action += "<button class='green' onclick='reviewDWR("+idx+")'>Reviewed</button>"; }
    html += "<tr><td>"+(i+1)+"</td><td>"+e.date+"</td><td>"+e.name+"</td><td>"+e.type+"</td><td>"+e.project+"</td><td class='"+String(e.priority).toLowerCase()+"'>"+e.priority+"</td><td>"+e.description+"</td><td>"+e.status+"</td><td>"+e.planned+"</td><td>"+e.actual+"</td><td>"+e.remarks+"</td><td>"+(e.review||"-")+"</td><td>"+action+"</td></tr>";
  });
  document.getElementById("dwrTable").innerHTML = html;
}

function editDWR(i){
  var e = db.dwr[i];
  document.getElementById("workDate").value=e.date;
  document.getElementById("dayStatus").value=e.type || "Working";
  document.getElementById("project").value=e.project;
  document.getElementById("priority").value=e.priority;
  document.getElementById("description").value=e.description;
  document.getElementById("status").value=e.status==="Leave"?"Completed":e.status;
  document.getElementById("planned").value=e.planned;
  document.getElementById("actual").value=e.actual;
  document.getElementById("remarks").value=e.remarks;
  editIndex=i;
  window.scrollTo(0,0);
}
function deleteDWR(i){ if(confirm("Delete this entry?")){ db.dwr.splice(i,1); saveDB(); renderDWR(); generateReport(); } }
function reviewDWR(i){ db.dwr[i].review = "Reviewed by "+currentUser.name+" on "+now(); saveDB(); renderDWR(); }

function generateReport(){
  var data = getFiltered();
  var report = "DAILY WORK REPORT\\n====================================\\n";
  report += "Total Entries: "+data.length+"\\n";
  report += "Working DWR: "+data.filter(function(e){return e.type==='Working';}).length+"\\n";
  report += "Leave Marked: "+data.filter(function(e){return e.type==='Leave';}).length+"\\n\\n";
  data.forEach(function(e,i){
    report += (i+1)+". "+e.date+" | "+e.name+" | "+e.type+" | "+e.project+"\\n";
    report += "   Status: "+e.status+" | Actual: "+e.actual+"% | Remarks: "+(e.remarks||"-")+"\\n";
    report += "   Work: "+e.description+"\\n\\n";
  });
  document.getElementById("reportOutput").textContent = report;
}
function copyReport(){ navigator.clipboard.writeText(document.getElementById("reportOutput").textContent); alert("Report copied"); }

function exportCSV(){
  var data = getFiltered();
  var csv = "Date,Name,Type,Project,Priority,Description,Status,Planned,Actual,Remarks,Review\\n";
  data.forEach(function(e){
    var row = [e.date,e.name,e.type,e.project,e.priority,e.description,e.status,e.planned,e.actual,e.remarks,e.review];
    csv += row.map(function(v){return '"'+String(v||"").replace(/"/g,'""')+'"';}).join(",")+"\\n";
  });
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="DWR_Report.csv";
  a.click();
}

function addMember(){
  if(!isAdmin()){ alert("Only admin can manage team"); return; }
  var name=document.getElementById("empName").value.trim();
  var login=document.getElementById("empLogin").value.trim();
  var pass=document.getElementById("empPass").value.trim();
  var role=document.getElementById("empRole").value;
  if(!name || !login || !pass){ alert("Fill Name, Login ID and Password"); return; }
  var u=db.users.find(function(x){return x.login===login;});
  if(u){ u.name=name; u.password=pass; u.role=role; u.active=true; }
  else{ db.users.push({name:name,login:login,password:pass,role:role,active:true}); }
  document.getElementById("empName").value="";
  document.getElementById("empLogin").value="";
  document.getElementById("empPass").value="";
  saveDB(); renderMembers();
}
function removeMember(login){
  if(login==="admin"){ alert("Default admin cannot be removed"); return; }
  var u=db.users.find(function(x){return x.login===login;});
  if(u){ u.active=false; saveDB(); renderMembers(); }
}
function renderMembers(){
  if(!isAdmin()){ document.getElementById("memberTable").innerHTML="<tr><td>Only admin can view team management.</td></tr>"; return; }
  var html="<tr><th>Name</th><th>Login ID</th><th>Password</th><th>Role</th><th>Status</th><th>Action</th></tr>";
  db.users.forEach(function(u){
    html+="<tr><td>"+u.name+"</td><td>"+u.login+"</td><td>"+u.password+"</td><td>"+u.role+"</td><td>"+(u.active?"Active":"Removed")+"</td><td>"+(u.active?"<button class='red' onclick='removeMember(&quot;"+u.login+"&quot;)'>Remove</button>":"-")+"</td></tr>";
  });
  document.getElementById("memberTable").innerHTML=html;
}

function downloadBackup(){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));
  a.download="central_dwr_backup.json";
  a.click();
}
function uploadBackup(e){
  var file=e.target.files[0]; if(!file) return;
  var r=new FileReader();
  r.onload=function(){ db=JSON.parse(r.result); saveDB(); renderAll(); alert("Backup uploaded successfully"); };
  r.readAsText(file);
}
function renderAll(){ renderDWR(); renderMembers(); }
</script>
</body>
</html>
